<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sede Clara VLC - MVP Hackathon</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <header class="border-b pb-4">
            <h1 class="text-3xl font-bold text-blue-900">Sede Clara VLC & València Cita Cero Errores</h1>
            <p class="text-sm text-slate-600">Slice Vertical Ejecutable - Transformación Digital Ayuntamiento de València</p>
        </header>

        <!-- BLOQUE 1: FUNCIONARIO (Lenguaje Claro + Auditoría) -->
        <section class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h2 class="text-xl font-semibold text-blue-800">1. Panel de Funcionario: Simplificación de Trámites (<code>HA.PL.80</code> / <code>PA.GP.50</code>)</h2>
            <div>
                <label class="block text-sm font-medium">Código de Procedimiento:</label>
                <input id="procCode" type="text" value="PA.GP.50" class="border p-2 rounded w-full mt-1" />
            </div>
            <div>
                <label class="block text-sm font-medium">ID Funcionario:</label>
                <input id="officerId" type="text" value="FUNC_VALENCIA_402" class="border p-2 rounded w-full mt-1" />
            </div>
            <button onclick="simplifyText()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 cursor-pointer">Analizar y Simplificar con IA</button>
            
            <div id="resultSimplify" class="hidden bg-slate-100 p-4 rounded space-y-2 mt-4 text-sm">
                <p><strong>Texto Original:</strong> <span id="resOriginal"></span></p>
                <p class="text-emerald-700"><strong>Versión Lenguaje Claro:</strong> <span id="resSimplified"></span></p>
                <div class="flex gap-2 pt-2">
                    <button onclick="sendAudit('ACEPTADO')" class="bg-emerald-600 text-white px-3 py-1 rounded cursor-pointer">Aceptar</button>
                    <button onclick="sendAudit('MODIFICADO')" class="bg-amber-600 text-white px-3 py-1 rounded cursor-pointer">Modificar</button>
                </div>
            </div>
        </section>

        <!-- BLOQUE 2: CIUDADANO (Validador Pre-Cita) -->
        <section class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h2 class="text-xl font-semibold text-emerald-800">2. Portal Ciudadano: Pre-Validador Documental de Padrón</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Nombre Solicitante:</label>
                    <input id="cName" type="text" value="Vladyslav Taratunskyi" class="border p-2 rounded w-full mt-1" />
                </div>
                <div>
                    <label class="block text-sm font-medium">Meses de vigencia contrato alquiler:</label>
                    <input id="cMonths" type="number" value="4" class="border p-2 rounded w-full mt-1" />
                </div>
            </div>
            <div class="flex items-center gap-4">
                <label class="flex items-center gap-2"><input id="cReceipt" type="checkbox" /> ¿Tiene recibo del mes en curso?</label>
                <label class="flex items-center gap-2"><input id="cDni" type="checkbox" checked /> DNI/NIE en vigor</label>
            </div>
            <button onclick="validatePadron()" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700 cursor-pointer">Verificar Documentos Antes de Cita</button>
            
            <div id="resultValidation" class="hidden p-4 rounded mt-4 text-sm"></div>
        </section>
    </div>

    <script>
        async function simplifyText() {
            const code = document.getElementById('procCode').value;
            const officer = document.getElementById('officerId').value;
            const res = await fetch('/api/simplify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({procedure_code: code, original_text: "", officer_id: officer})
            });
            const data = await res.json();
            document.getElementById('resOriginal').innerText = data.original;
            document.getElementById('resSimplified').innerText = data.simplified;
            document.getElementById('resultSimplify').classList.remove('hidden');
        }

        async function sendAudit(decision) {
            const code = document.getElementById('procCode').value;
            const officer = document.getElementById('officerId').value;
            await fetch(`/api/audit/action?procedure_code=${code}&officer_id=${officer}&decision=${decision}`, {method: 'POST'});
            alert('Decisión registrada con trazabilidad en el sistema.');
        }

        async function validatePadron() {
            const name = document.getElementById('cName').value;
            const months = parseInt(document.getElementById('cMonths').value);
            const receipt = document.getElementById('cReceipt').checked;
            const dni = document.getElementById('cDni').checked;

            const res = await fetch('/api/validate-padron', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({applicant_name: name, document_type: "alquiler", months_duration: months, has_current_receipt: receipt, dni_valid: dni})
            });
            const data = await res.json();
            const box = document.getElementById('resultValidation');
            box.classList.remove('hidden');
            if(data.approved) {
                box.className = "bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded mt-4 text-sm";
                box.innerHTML = `<strong>¡Aprobado!</strong> ${data.message}<br>Código QR de Pase: <code>${data.qr_pass_code}</code>`;
            } else {
                box.className = "bg-rose-50 border border-rose-200 text-rose-800 p-4 rounded mt-4 text-sm";
                box.innerHTML = `<strong>Atención - Errores Detectados:</strong><br>` + data.errors.map(e => `- ${e}`).join('<br>') + `<br><p class="mt-2 text-xs text-rose-600">${data.message}</p>`;
            }
        }
    </script>
</body>
</html>
